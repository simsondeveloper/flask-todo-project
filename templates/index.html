<form action="/submittodoitem" method="POST">
    <div class="mb-3">
    <label>Item ID</label>
    <input type="text" name="itemId" class="form-control">
</div>
<div class="mb-3">
    <label>Item UUID</label>
    <input type="text" name="itemUUID" class="form-control">
</div>
<div class="mb-3">
    <label>Item Hash</label>
    <input type="text" name="itemHash" class="form-control">
</div>

    <label>Item Name</label>
    <input type="text" name="itemName" required>

    <label>Item Description</label>
    <textarea name="itemDescription" required></textarea>

    <button type="submit">Submit Item</button>

</form>
